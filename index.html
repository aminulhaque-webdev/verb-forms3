const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const VERBS = RAW.trim().split("\n").map(l => {
  const [v1, v2, v3, bn, emoji, s1, s2, s3] = l.split("|");
  return { v1, v2, v3, bn, emoji, ex: [["Present", s1], ["Past", s2], ["Present perfect", s3]] };
}).sort((a, b) => a.v1.localeCompare(b.v1)).map((v, i) => ({ ...v, n: i + 1 }));

const STEP = 60;
const state = { q: "", letter: "", shown: STEP };
const $ = id => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function sentence(src) {
  const p = el("p");
  src.split(/\*([^*]+)\*/).forEach((part, i) => {
    if (i % 2) p.appendChild(el("mark", "", part));
    else if (part) p.appendChild(document.createTextNode(part));
  });
  return p;
}

function card(v) {
  const c = el("article", "card");
  c.appendChild(el("div", "tile", v.emoji)).setAttribute("aria-hidden", "true");
  const head = el("div", "head");
  head.append(el("h2", "", cap(v.v1)), el("span", "num", "#" + v.n));
  c.append(head, el("p", "bn", v.bn));
  const forms = el("div", "forms");
  [["V1", v.v1], ["V2", v.v2], ["V3", v.v3]].forEach(([k, w]) => {
    const s = el("span");
    s.append(el("b", "", k), document.createTextNode(cap(w)));
    forms.appendChild(s);
  });
  c.appendChild(forms);
  const ul = el("ul", "ex");
  v.ex.forEach(([label, text]) => {
    const li = el("li");
    li.append(el("small", "", label), sentence(text));
    ul.appendChild(li);
  });
  c.appendChild(ul);
  return c;
}

function matches() {
  const q = state.q.trim().toLowerCase();
  return VERBS.filter(v => {
    if (state.letter && v.v1[0].toUpperCase() !== state.letter) return false;
    if (!q) return true;
    return [v.v1, v.v2, v.v3].some(w => w.toLowerCase().includes(q)) || v.bn.includes(state.q.trim());
  });
}

function render() {
  const list = matches();
  const visible = list.slice(0, state.shown);
  const grid = $("grid");
  grid.replaceChildren(...visible.map(card));
  if (!list.length) grid.appendChild(el("p", "empty", "No verbs match your search. Try another word or letter."));
  $("count").textContent = visible.length + " of " + VERBS.length + " verbs" + (list.length !== VERBS.length ? " (" + list.length + " found)" : "");
  const more = $("more");
  more.hidden = visible.length >= list.length;
  more.textContent = "Show more verbs (" + (list.length - visible.length) + " left)";
}

function buildLetters() {
  const have = new Set(VERBS.map(v => v.v1[0].toUpperCase()));
  const box = $("letters");
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(L => {
    const b = el("button", "", L);
    b.type = "button";
    b.disabled = !have.has(L);
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      state.letter = state.letter === L ? "" : L;
      state.shown = STEP;
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.textContent === state.letter)));
      render();
    });
    box.appendChild(b);
  });
}

$("q").addEventListener("input", e => { state.q = e.target.value; state.shown = STEP; render(); });
$("more").addEventListener("click", () => { state.shown += STEP; render(); });
buildLetters();
render();
</script>
